  <body style="margin:0;padding:0;box-sizing:border-box;overflow:hidden">
    <!-- 首屏静态加载壳：JS bundle 下载/执行期间展示，React 挂载后由 LoadingScreen 接管。
         标记结构与 LoadingMask 完全同构（.lm-mask 三件套 + 居中 label），进度不再用
         进度条，而是以「文字 + 百分比」呈现。 -->
    <!-- 根容器高度必须与移动端外壳（tailwind.css 的 app-screen-h）用同一套单位。
         只写 100vh：iOS Safari 取的是「地址栏收起」的大视口，比可视区更高，
         100dvh 的外壳矮一截，差额就在底部露出空白；
         只写 100dvh：不支持 dvh 的旧内核会整条丢弃声明、高度退回 auto，同样撑不满。
         因此两条都写，由浏览器各取所需。 -->
    <div id="root" class="h-screen overflow-hidden" style="height:100vh;height:100dvh">
      <div style="position:fixed;inset:0;z-index:9999;overflow:hidden">
        <div class="lm-mask" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <div class="lm-mask__blur"></div>
          <div class="lm-mask__shimmer"></div>
          <div class="lm-mask__noise"></div>
          <span class="lm-mask__label" id="boot-label">正在加载资源 0%</span>
        </div>
      </div>
    </div>
    <!-- 静态壳的百分比：没有真实进度可读，用一条缓慢爬升的曲线制造「正在推进」的观感，
         爬到 70% 即停住 —— 与 React 侧 BootOverlay 的接管起点(70%)对齐，进度单调不回跳。
         classic script 在解析到此处即执行，早于下方 type=module 的入口。 -->
    <script>
      (function () {
        var el = document.getElementById('boot-label');
        if (!el) return;
        var p = 0;
        var timer = setInterval(function () {
          p += Math.random() * 2 + (p < 40 ? 1.2 : 0.4);
          if (p >= 70) {
            p = 70;
            clearInterval(timer);
          }
          el.textContent = '正在加载资源 ' + Math.floor(p) + '%';
        }, 160);
      })();
    </script>
  </body>
