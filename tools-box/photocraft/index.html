<script>
/* Embedded copy (tools-box): 只阻断 Discord 外链，详见 src/pages/PhotoCraft/index.jsx。

   PhotoCraft 的 Help 菜单与 About 对话框里带了一批外链：
     Join us on Discord   → https://discord.gg/artcraft     ← 本站不要，拦掉
     PhotoCraft website   → https://getartcraft.com/apps/photocraft
     GitHub               → https://github.com/storytold/photocraft(/issues)
     ArtCraft             → https://getartcraft.com
   文案编译在 wasm 里（改不掉），点击最终都落到 window.open 或一个临时 <a> 的
   click 上，所以只在这两个出口上判断：Discord 的一律不打开，**其余照常在新窗口
   打开**。同源、blob:、data: 一律放行 —— 保存 / 导出（下载）走的是这几条路。 */
(function () {
  // 只认主机名，不看路径 —— 邀请链接换了码也照样拦得住。后缀锚定，
  // 避免把 discord.gg.example.com 这类无关域名一起拦掉。
  var DISCORD_HOST = /(^|\.)(discord\.gg|discord\.com|discordapp\.com)$/;

  function isBlocked(url) {
    if (!url) return false;
    try {
      var u = new URL(String(url), location.href);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
      return DISCORD_HOST.test(u.hostname.toLowerCase());
    } catch (e) {
      return false; // 解析不了的交给浏览器原样处理
    }
  }

  var nativeOpen = window.open;
  window.open = function (url, target, features) {
    if (isBlocked(url)) {
      console.info('[tools-box] Discord 外链已阻断：' + url);
      return null;
    }
    return nativeOpen.call(window, url, target, features);
  };

  // 左键 / 中键点击 <a>（wasm-bindgen 的 open_url 会临时造一个 <a> 并 click 它）
  function onPointer(event) {
    var el = event.target;
    var a = el && el.closest ? el.closest('a[href]') : null;
    if (!a || !isBlocked(a.href)) return;
    event.preventDefault();
    event.stopPropagation();
    console.info('[tools-box] Discord 外链已阻断：' + a.href);
  }
  document.addEventListener('click', onPointer, true);
  document.addEventListener('auxclick', onPointer, true);
})();
</script>

</script>
