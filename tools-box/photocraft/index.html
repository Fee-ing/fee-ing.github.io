<script>
/* Embedded copy (tools-box): 只阻断 Discord 外链，详见 src/pages/PhotoCraft/index.jsx。

   PhotoCraft 的 Help 菜单与 About 对话框里带了一批外链：
     Join us on Discord   → https://discord.gg/artcraft     ← 本站不要，拦掉
     PhotoCraft website   → https://getartcraft.com/apps/photocraft
     GitHub               → https://github.com/storytold/photocraft(/issues)
     ArtCraft             → https://getartcraft.com
   上面是上游英文原文（本站已由下面的 i18n 脚本切成简体中文），但链接目标不变。
   点击最终都落到 window.open 或一个临时 <a> 的 click 上，所以只在这两个出口上
   判断：Discord 的一律不打开，**其余照常在新窗口打开**。同源、blob:、data:
   一律放行 —— 保存 / 导出（下载）走的是这几条路。 */
(function () {
  // 只认主机名，不看路径 —— 邀请链接换了码也照样拦得住。后缀锚定，
  // 避免把 discord.gg.example.com 这类无关域名一起拦掉。
  var DISCORD_HOST = /(^|\.)(discord\.gg|discord\.com|discordapp\.com)$/;

  function isBlocked(url) {
    if (!url) return false;
    try {
      var u = new URL(String(url), location.href);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
      return DISCORD_HOST.test(u.hostname.toLowerCase());
    } catch (e) {
      return false; // 解析不了的交给浏览器原样处理
    }
  }

  var nativeOpen = window.open;
  window.open = function (url, target, features) {
    if (isBlocked(url)) {
      console.info('[tools-box] Discord 外链已阻断：' + url);
      return null;
    }
    return nativeOpen.call(window, url, target, features);
  };

  // 左键 / 中键点击 <a>（wasm-bindgen 的 open_url 会临时造一个 <a> 并 click 它）
  function onPointer(event) {
    var el = event.target;
    var a = el && el.closest ? el.closest('a[href]') : null;
    if (!a || !isBlocked(a.href)) return;
    event.preventDefault();
    event.stopPropagation();
    console.info('[tools-box] Discord 外链已阻断：' + a.href);
  }
  document.addEventListener('click', onPointer, true);
  document.addEventListener('auxclick', onPointer, true);
})();

/* Embedded copy (tools-box)：静音 eframe 那条「未实现 viewport 命令」的告警。

   启动后 eframe 会打一条：
     [eframe::web::app_runner] … Unhandled egui viewport command:
     Title("PhotoCraft") - not implemented in web backend
   Rust 侧调了 ViewportCommand::Title，而 web 后端不实现它 —— 网页标题本来就是
   index.html 里的 <title>PhotoCraft</title>，行为没有任何缺失，纯粹是噪音。
   文案在 wasm 里改不掉，只能在这里按内容精确过滤：只丢这一条，其余
   console.warn / info / error 一律原样透传。 */
(function () {
  var MUTED = /Unhandled egui viewport command: Title\("PhotoCraft"\)/;
  var nativeWarn = console.warn;
  console.warn = function () {
    try {
      if (MUTED.test(Array.prototype.join.call(arguments, ' '))) return;
    } catch (e) {
      /* 判断失败就原样输出 */
    }
    return nativeWarn.apply(console, arguments);
  };
})();
</script>

<script>
/* Embedded copy (tools-box)：默认把 PhotoCraft 界面切到简体中文，详见
   src/pages/PhotoCraft/index.jsx 的改动 ⑦。

   上游 0.17.0 内置 zh-hans / zh-hant 目录（i18n.rs 的 LANGUAGES），语言取自
   localStorage["photocraft.preferences"] 里的 interface.language：
     Lang::from_pref(pref) -> zh-hans | zh-hant | auto | ...
   只在缺失或 auto 时写入 zh-hans；用户若在应用内显式选过语言，尊重其选择。
   必须在下面的 module 脚本之前执行 —— WASM 启动时一次性读取这份偏好。 */
(function () {
  try {
    var KEY = 'photocraft.preferences';
    var raw = localStorage.getItem(KEY);
    var prefs = raw ? JSON.parse(raw) : {};
    if (!prefs || typeof prefs !== 'object' || Array.isArray(prefs)) prefs = {};
    var iface = prefs.interface;
    if (!iface || typeof iface !== 'object' || Array.isArray(iface)) iface = prefs.interface = {};
    if (!iface.language || String(iface.language).toLowerCase() === 'auto') {
      iface.language = 'zh-hans';
      localStorage.setItem(KEY, JSON.stringify(prefs));
    }
  } catch (e) {
    /* 隐私模式 / 存储不可用：交给应用自己的默认逻辑 */
  }
})();
</script>
